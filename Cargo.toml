[package]
name = "kcheck"
rust-version = "1.83.0"
edition = "2021"
build = "build.rs"

[profile.dev]
panic = "abort"

[profile.release]
lto = "thin"
strip = true
overflow-checks = true
panic = "abort"

[build-dependencies]
vergen-git2 = "1.0.5"

[dependencies]
kaspa-wrpc-client = { git = "https://github.com/kaspanet/rusty-kaspa.git", tag = "v0.16.1" }
kaspa-rpc-core = { git = "https://github.com/kaspanet/rusty-kaspa.git", tag = "v0.16.1" }
clap = { version = "4.5.31", features = ["derive"] }
tokio = { version = "1.43.0", features = ["rt-multi-thread"] }
